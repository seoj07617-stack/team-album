<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>球队相册</title>
<link rel="icon" href="assets/logo-crest.png">
<link rel="apple-touch-icon" href="assets/logo-crest.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="球队相册">
<link rel="manifest" href="site.webmanifest">
<style>
:root{
  --bg:#ffffff;
  --ink:#1b1a3a; --sub:#5d5a86;
  --purple:#5b5bd6;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c4ae8 55%,#a855f7 100%);
  --grad-soft:linear-gradient(135deg,rgba(79,70,229,.14),rgba(168,85,247,.14));
  --glass:rgba(255,255,255,.66);
  --glass-strong:rgba(255,255,255,.78);
  --glass-border:rgba(255,255,255,.75);
  --glass-blur:saturate(170%) blur(22px);
  --line:rgba(98,88,190,.14);
  --field:rgba(255,255,255,.55);
  --glow:0 10px 34px rgba(31,26,88,.12);
  --press:transform .16s cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.32,.72,0,1);
  --radius:18px; --radius-xs:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c0a1e;
    --ink:#f0eefc; --sub:#a7a3cc;
    --glass:rgba(24,22,52,.55);
    --glass-strong:rgba(28,26,58,.7);
    --glass-border:rgba(255,255,255,.15);
    --line:rgba(255,255,255,.09);
    --field:rgba(255,255,255,.12);
    --glow:0 10px 34px rgba(0,0,0,.38);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit}
/* ---- 极光背景（玻璃模糊的内容源） ---- */
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(640px 460px at 12% 6%, rgba(139,124,255,.09), transparent 62%),
    radial-gradient(760px 560px at 92% 16%, rgba(196,141,255,.08), transparent 62%),
    radial-gradient(900px 640px at 50% 104%, rgba(124,158,255,.07), transparent 66%),
    var(--bg);
}
@media(prefers-color-scheme:dark){
  #aurora{background:
    radial-gradient(640px 460px at 12% 6%, rgba(99,82,220,.34), transparent 62%),
    radial-gradient(760px 560px at 92% 16%, rgba(157,84,230,.26), transparent 62%),
    radial-gradient(900px 640px at 50% 104%, rgba(76,110,245,.24), transparent 66%),
    radial-gradient(520px 420px at 84% 84%, rgba(214,110,190,.14), transparent 62%),
    var(--bg);}
}
.glass{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);box-shadow:var(--glow)}

/* ---- 顶栏：紫色渐变玻璃 ---- */
#topbar{position:fixed;top:12px;left:12px;right:12px;z-index:40;height:52px;border-radius:16px;padding:0 6px 0 10px;
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,rgba(28,25,86,.92),rgba(71,28,142,.86));
  backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 28px rgba(24,18,72,.4), inset 0 1px 0 rgba(255,255,255,.12)}
#btn-menu{width:38px;height:38px;border:none;background:transparent;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex:none;transition:background .2s var(--ease),transform .16s var(--ease)}
#btn-menu:active{background:rgba(255,255,255,.2);transform:scale(.9)}
#btn-menu svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#topbar .crest{position:absolute;left:50%;transform:translateX(-50%);width:34px;height:34px;display:block;border-radius:10px;filter:drop-shadow(0 1px 4px rgba(15,20,25,.35))}
#topbar .d{margin-left:auto;font-size:12px;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;margin-right:4px}

/* ---- 抽屉（玻璃面板） ---- */
#drawer-mask{position:fixed;inset:0;background:rgba(18,14,44,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:45;opacity:0;pointer-events:none;transition:opacity .38s var(--ease)}
#drawer-mask.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:288px;max-width:84vw;z-index:46;border-radius:0 22px 22px 0;overflow:hidden;
  background:var(--glass-strong);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);
  border-right:1px solid var(--glass-border);box-shadow:14px 0 44px rgba(24,18,64,.22);
  transform:translateX(-104%);transition:transform .42s var(--ease),visibility 0s linear .42s;will-change:transform;display:flex;flex-direction:column;visibility:hidden}
#drawer.open{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
#drawer.open .dr-head{animation:drIn .5s var(--ease) .08s both}
@keyframes drIn{from{transform:translateY(-14px)}to{transform:none}}
.dr-head{background-color:#2b2150;background-image:linear-gradient(180deg,rgba(26,18,52,0) 38%,rgba(26,18,52,.62) 100%),url("assets/drawer-bg.jpg?v=1");background-size:cover,cover;background-position:center top;padding:calc(env(safe-area-inset-top,0px) + 34px) 20px 26px;color:#fff;position:relative;overflow:hidden;flex:none}
.dr-head .crest{width:76px;height:76px;display:block;margin:0 auto;position:relative;z-index:1;filter:drop-shadow(0 3px 10px rgba(15,20,25,.35))}
.dr-nav{flex:1;overflow-y:auto;padding:12px 10px}
.dr-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-xs);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);transition:background .2s var(--ease),color .2s var(--ease),transform .16s var(--ease)}
.dr-item:active{background:rgba(120,110,200,.14);transform:scale(.97)}
.dr-item.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(109,74,232,.35)}
.dr-item .chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s}
.dr-item .chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dr-item.on .chip{background:rgba(255,255,255,.2)}
.dr-item .n{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;transition:color .2s}
.dr-item.on .n{color:rgba(255,255,255,.9)}
.dr-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--sub);border-top:1px solid var(--line);line-height:1.6;flex:none}

/* ---- 密码门（极光上的玻璃卡） ---- */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:transparent}
.gate-card{width:100%;max-width:344px;border-radius:24px;padding:34px 26px 28px;text-align:center;
  background:var(--glass-strong);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border:1px solid var(--glass-border);box-shadow:0 24px 60px rgba(28,20,80,.22);
  animation:cardIn .6s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.gate-ico{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 26px rgba(109,74,232,.4)}
.gate-card h1{font-size:19px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.gate-card p{font-size:13px;color:var(--sub);margin-bottom:20px}
#pwd{width:100%;height:47px;border:1.5px solid var(--line);border-radius:13px;padding:0 14px;font-size:16px;outline:none;text-align:center;letter-spacing:2px;background:var(--field);color:var(--ink);transition:border .25s,box-shadow .25s,background .25s}
#pwd:focus{border-color:#7c4ae8;box-shadow:0 0 0 4px rgba(124,74,232,.18)}
#btn-enter{width:100%;height:47px;border:none;border-radius:13px;background:var(--grad);color:#fff;font-size:15px;font-weight:700;margin-top:14px;cursor:pointer;box-shadow:0 10px 26px rgba(109,74,232,.4);transition:transform .16s var(--ease),box-shadow .25s}
#btn-enter:active{transform:scale(.96);box-shadow:0 5px 14px rgba(109,74,232,.35)}
#gate-err{font-size:12px;color:#e5484d;margin-top:12px;min-height:16px}

/* ---- 主体 ---- */
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 78px) 16px 48px}
@media(min-width:600px){#app{padding-left:32px;padding-right:32px}}
/* ---- 当前分类条（玻璃胶囊） ---- */
#curbar{display:flex;align-items:center;gap:10px;border-radius:var(--radius-xs);padding:11px 15px;margin-bottom:12px;font-size:13px;font-weight:600;
  animation:dropIn .45s var(--ease) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#curbar .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);flex:none;box-shadow:0 0 8px rgba(139,92,246,.6)}
#curbar-back{margin-left:auto;border:none;color:#fff;font-size:12px;font-weight:600;padding:7px 15px;border-radius:999px;cursor:pointer;background:var(--grad);box-shadow:0 6px 16px rgba(109,74,232,.32);transition:transform .16s var(--ease)}
#curbar-back:active{transform:scale(.93)}

/* 概览卡（玻璃砖） */
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.ov-card{border-radius:var(--radius);padding:13px 11px;text-align:left;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .25s;
  animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.ov-card:active{transform:scale(.95)}
.ov-card::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:opacity .3s;pointer-events:none}
.ov-card:active::after{opacity:1}
.ov-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;transition:transform .2s var(--ease)}
.ov-card:active .ov-icon{transform:scale(1.12)}
.ov-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ov-label{font-size:11px;color:var(--sub);font-weight:600}
.ov-value{font-size:23px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}

/* 相册分区（玻璃卡） */
.album-card{border-radius:var(--radius);margin-bottom:12px;overflow:hidden;animation:rise .55s var(--ease) both}
.album-head{display:flex;align-items:center;gap:10px;padding:14px 15px 9px}
.album-head .chip{width:31px;height:31px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.album-head .chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.album-head .name{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.album-head .cnt{font-size:12px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums;background:rgba(120,110,200,.1);padding:4px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px 9px 11px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:9px;background:rgba(120,110,200,.12);cursor:pointer;animation:rise .5s var(--ease) both}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.06);transition:opacity .5s,transform .55s var(--ease)}
.ph img.ok{opacity:1;transform:none}
.ph:active img.ok{transform:scale(.94)}

/* ---- 状态卡 ---- */
.state{padding:56px 20px;text-align:center;color:var(--sub);font-size:14px;border-radius:var(--radius);margin-bottom:12px;animation:rise .5s var(--ease) both}
.state .ico{width:52px;height:52px;margin:0 auto 12px;color:rgba(120,110,200,.4);display:block}
.state .es-s{font-size:12px;color:var(--sub);margin-top:4px;opacity:.8}
#btn-retry{margin-top:14px;height:38px;padding:0 24px;border:none;color:#fff;background:var(--grad);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(109,74,232,.32);transition:transform .16s var(--ease)}
#btn-retry:active{transform:scale(.94)}
footer{text-align:center;font-size:11px;color:var(--sub);padding:24px 20px 0;opacity:.75}
.spinner{width:32px;height:32px;margin:0 auto 12px;border:3px solid rgba(120,110,200,.18);border-top-color:#7c4ae8;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- 大图（毛玻璃暗场） ---- */
#lb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:rgba(12,10,26,.86);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  opacity:0;transition:opacity .3s var(--ease)}
#lb.in{opacity:1}
#lb-img{transition:transform .34s var(--ease)}
#lb.in #lb-img{transform:scale(1)}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;color:#fff}
.lb-cnt{font-size:13px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:7px 13px;border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#lb-close{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .16s var(--ease),background .2s}
#lb-close:active{transform:scale(.9);background:rgba(255,255,255,.28)}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#lb-img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .16s var(--ease),background .2s}
.lb-nav:active{transform:translateY(-50%) scale(.9);background:rgba(255,255,255,.26)}
#lb-prev{left:10px}
#lb-next{right:10px}
.lb-hint{text-align:center;color:rgba(255,255,255,.5);font-size:11px;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 14px)}
.hidden{display:none!important}
.locked{overflow:hidden}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="aurora"></div>

<!-- 顶栏：左上角抽屉入口 + 队徽（紫色渐变玻璃） -->
<div id="topbar" class="hidden">
  <button id="btn-menu" aria-label="打开菜单">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <img class="crest" src="assets/logo-crest.png?v=2" alt="队徽">
  <div class="d" id="total-cnt"></div>
</div>

<!-- 抽屉 -->
<div id="drawer-mask"></div>
<aside id="drawer">
  <div class="dr-head">
    <img class="crest" src="assets/logo-crest.png?v=2" alt="队徽">
  </div>
  <nav class="dr-nav" id="dr-nav"></nav>
  <div class="dr-foot">仅限球队家庭访问<br>请勿将链接与密码外传</div>
</aside>

<!-- 访问密码门 -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-ico">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>球队相册</h1>
    <p>仅限球队家庭访问，请输入访问密码</p>
    <input id="pwd" type="password" placeholder="访问密码" autocomplete="off">
    <button id="btn-enter">进入相册</button>
    <div id="gate-err"></div>
  </div>
</div>

<!-- 相册主体 -->
<div id="app" class="hidden">
  <div id="curbar" class="glass hidden"><span class="dot"></span><span id="curbar-name"></span><button id="curbar-back">查看全部</button></div>
  <div class="ov-grid" id="ov"></div>
  <div id="albums"></div>
  <div id="empty-state" class="state glass hidden">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
    <div class="es-t"></div>
    <div class="es-s">照片上传后即可在这里查看</div>
  </div>
  <footer>照片由教练统一整理上传 · 请勿将链接与密码外传</footer>
</div>

<!-- 大图浏览 -->
<div id="lb" class="hidden">
  <div class="lb-top">
    <div class="lb-cnt" id="lb-cnt"></div>
    <button id="lb-close" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="lb-stage">
    <img id="lb-img" alt="" style="transform:scale(.94)">
    <button id="lb-prev" class="lb-nav" aria-label="上一张">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="lb-next" class="lb-nav" aria-label="下一张">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="lb-hint">左右滑动切换 · 下滑关闭 · 长按可保存照片</div>
</div>

<script>
"use strict";
/* ================= 配置 ================= */
const OWNER="seoj07617-stack", REPO="team-album";
const SITE="https://seoj07617-stack.github.io/team-album/";
const PASS_SHA256="072e379e98c0dc84cab004cf96aca539b05fe25f0398d0447de937772fc791ab"; // 访问密码的SHA-256，改密码请替换此值
const PASS_DAYS=30;
const IMG_RE=/\.(jpe?g|png|gif|webp|bmp)$/i;
/* 相册图标与配色（新增相册名不在表内时用默认样式） */
const THEME={
  "全部":{c:"#5b5bd6",bg:"rgba(91,91,214,0.12)",icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>'},
  "集体照":{c:"#5b5bd6",bg:"rgba(91,91,214,0.12)",icon:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3.5"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M15.5 3.6a3.5 3.5 0 0 1 0 6.8"/></svg>'},
  "训练照":{c:"#059669",bg:"rgba(5,150,105,0.12)",icon:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></svg>'},
  "比赛照":{c:"#d97706",bg:"rgba(217,119,6,0.12)",icon:'<svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 3h12v6a6 6 0 0 1-12 0V3z"/><path d="M6 5H3v2a4 4 0 0 0 3 3.87"/><path d="M18 5h3v2a4 4 0 0 1-3 3.87"/></svg>'},
  "个人照":{c:"#2563eb",bg:"rgba(37,99,235,0.12)",icon:'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="3.5"/></svg>'},
  "_default":{c:"#536471",bg:"rgba(83,100,113,0.12)",icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>'}
};
/* ======================================== */

const $=s=>document.querySelector(s);
const gate=$("#gate"), app=$("#app"), albumsBox=$("#albums"), lb=$("#lb"), drawer=$("#drawer"), mask=$("#drawer-mask");
let photos=[], counts={}, curTab="全部", albumsCache=[];

/* ---- 访问密码 ---- */
async function sha256hex(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function passOk(){
  try{const o=JSON.parse(localStorage.getItem("album_pass_v1"));return o&&Date.now()-o.t<PASS_DAYS*864e5}
  catch(e){return false}
}
async function enter(){
  const v=$("#pwd").value.trim();
  if(!v){$("#gate-err").textContent="请输入密码";return}
  $("#btn-enter").textContent="验证中…";
  const ok=await sha256hex(v)===PASS_SHA256;
  $("#btn-enter").textContent="进入相册";
  if(ok){localStorage.setItem("album_pass_v1",JSON.stringify({t:Date.now()}));unlock()}
  else{$("#gate-err").textContent="密码不正确，请重试";$("#pwd").value=""}
}
function unlock(){
  gate.classList.add("hidden");document.body.classList.remove("locked");
  app.classList.remove("hidden");$("#topbar").classList.remove("hidden");
  load();
}
$("#btn-enter").addEventListener("click",enter);
$("#pwd").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});

/* ---- 抽屉 ---- */
function openDrawer(){drawer.classList.add("open");mask.classList.add("open")}
function closeDrawer(){drawer.classList.remove("open");mask.classList.remove("open")}
$("#btn-menu").addEventListener("click",openDrawer);
mask.addEventListener("click",closeDrawer);
$("#curbar-back").addEventListener("click",()=>setTab("全部"));
function navNames(){return ["全部","个人照","集体照","训练照","比赛照"]}
function theme(name){return THEME[name]||THEME["_default"]}

function renderNav(){
  const total=photos.length;
  $("#dr-nav").innerHTML=navNames().map(n=>{
    const th=theme(n), cnt=n==="全部"?total:(counts[n]||0);
    return '<div class="dr-item'+(n===curTab?' on':'')+'" data-n="'+esc(n)+'"><div class="chip" style="color:var(--sub);background:rgba(120,110,200,.09)">'+th.icon+'</div><span>'+esc(n)+'</span><span class="n">'+cnt+'</span></div>';
  }).join("");
  $("#dr-nav").querySelectorAll(".dr-item").forEach(el=>el.addEventListener("click",()=>setTab(el.dataset.n)));
}

function setTab(name){
  curTab=name;
  $("#dr-nav").querySelectorAll(".dr-item").forEach(b=>b.classList.toggle("on",b.dataset.n===name));
  const ov=$("#ov"), cb=$("#curbar");
  if(name==="全部"){
    ov.style.display="";cb.classList.add("hidden");
    albumsBox.querySelectorAll(".album-card").forEach(s=>s.style.display="");
  }else{
    ov.style.display="none";cb.classList.remove("hidden");
    $("#curbar-name").textContent="当前分类："+name;
    albumsBox.querySelectorAll(".album-card").forEach(s=>s.style.display=(s.dataset.a===name)?"":"none");
  }
  const visible=[...albumsBox.querySelectorAll(".album-card")].some(s=>s.style.display!=="none");
  const es=$("#empty-state");
  if(name!=="全部"&&!visible&&albumsCache.length>0){
    es.querySelector(".es-t").textContent="「"+name+"」还在整理中";
    es.classList.remove("hidden");
  }else es.classList.add("hidden");
  closeDrawer();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---- 相册加载：GitHub API自动发现 → 本地缓存兜底 → manifest清单兜底 ---- */
function getJSON(url,timeout){
  return new Promise((res,rej)=>{
    const c=("AbortController"in window)?new AbortController():null;
    const t=setTimeout(()=>{if(c)c.abort();rej(new Error("timeout"))},timeout||8000);
    fetch(url,{headers:{Accept:"application/vnd.github+json"},signal:c?c.signal:undefined})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
      .then(j=>{clearTimeout(t);res(j)})
      .catch(e=>{clearTimeout(t);rej(e)});
  });
}
async function fromTrees(){
  const j=await getJSON("https://api.github.com/repos/"+OWNER+"/"+REPO+"/git/trees/main?recursive=1");
  const map={};
  for(const e of (j.tree||[])){
    if(e.type!=="blob")continue;
    const p=e.path||"";
    if(p.indexOf("uploads/")!==0||!IMG_RE.test(p))continue;
    const rest=p.slice(8),si=rest.indexOf("/");
    if(si<0||rest.indexOf("/",si+1)>=0)continue; /* 只认 uploads/相册/照片 一层结构 */
    (map[rest.slice(0,si)]=map[rest.slice(0,si)]||[]).push({name:rest.slice(si+1)});
  }
  return Object.keys(map).map(n=>({name:n,files:map[n]}));
}
function saveCache(albums){
  try{localStorage.setItem("album_cache_v1",JSON.stringify({t:Date.now(),albums:albums.map(a=>({name:a.name,files:a.files.map(f=>f.name)}))}))}catch(e){}
}
function fromCache(){
  try{
    const c=JSON.parse(localStorage.getItem("album_cache_v1")||"null");
    if(!c||!Array.isArray(c.albums))return null;
    return c.albums.map(a=>({name:a.name,files:(a.files||[]).filter(n=>IMG_RE.test(n)).map(n=>({name:n}))}));
  }catch(e){return null}
}
async function fromManifest(){
  const m=await getJSON(SITE+"manifest.json?t="+Date.now());
  return (m.albums||[]).map(a=>({name:a.name,files:(a.files||[]).filter(n=>IMG_RE.test(n)).map(n=>({name:n}))})).filter(a=>a.files.length);
}
async function load(){
  albumsBox.innerHTML='<div class="state glass"><div class="spinner"></div>正在加载相册…</div>';
  $("#ov").innerHTML="";$("#empty-state").classList.add("hidden");
  let albums=null;
  try{albums=await fromTrees();if(albums!==null)saveCache(albums)}catch(e){}
  if(albums===null)albums=fromCache();
  if(albums===null){try{albums=await fromManifest()}catch(e){}}
  if(albums===null){
    albumsBox.innerHTML='<div class="state glass">'
      +'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg>'
      +'相册加载失败，请检查网络后重试<button id="btn-retry">重新加载</button></div>';
    $("#btn-retry").addEventListener("click",load);
    return;
  }
  render(albums);
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(albums){
  photos=[];counts={};albumsCache=albums;
  $("#ov").innerHTML="";$("#empty-state").classList.add("hidden");
  if(!albums.length){
    albumsBox.innerHTML='<div class="state glass">'
      +'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>'
      +'照片整理中，敬请期待</div>';
    $("#total-cnt").textContent="";
    renderNav();
    return;
  }
  /* 概览卡（交错入场） */
  let ov="";
  for(let i=0;i<albums.length;i++){
    const a=albums[i], th=theme(a.name);
    counts[a.name]=a.files.length;
    ov+='<div class="ov-card glass" data-n="'+esc(a.name)+'" style="animation-delay:'+(i*70)+'ms"><div class="ov-icon" style="color:'+th.c+';background:'+th.bg+'">'+th.icon+'</div><div class="ov-label">'+esc(a.name)+'</div><div class="ov-value">'+a.files.length+'</div></div>';
  }
  $("#ov").innerHTML=ov;
  $("#ov").querySelectorAll(".ov-card").forEach(el=>el.addEventListener("click",()=>setTab(el.dataset.n)));
  /* 相册分区（交错入场） */
  let html="";
  for(let i=0;i<albums.length;i++){
    const a=albums[i], th=theme(a.name);
    html+='<section class="album-card glass" data-a="'+esc(a.name)+'" style="animation-delay:'+(140+i*90)+'ms"><div class="album-head"><div class="chip" style="color:'+th.c+';background:'+th.bg+'">'+th.icon+'</div><span class="name">'+esc(a.name)+'</span><span class="cnt">'+a.files.length+' 张</span></div><div class="grid">';
    for(const f of a.files){
      const url=SITE+"uploads/"+encodeURIComponent(a.name)+"/"+encodeURIComponent(f.name);
      const idx=photos.push({a:a.name,u:url})-1;
      html+='<div class="ph" data-i="'+idx+'" style="animation-delay:'+Math.min(idx*35,600)+'ms"><img loading="lazy" src="'+url+'" alt="" onload="this.classList.add(\'ok\')"></div>';
    }
    html+="</div></section>";
  }
  albumsBox.innerHTML=html;
  albumsBox.querySelectorAll(".ph").forEach(el=>el.addEventListener("click",()=>openLb(+el.dataset.i)));
  $("#total-cnt").textContent="共 "+photos.length+" 张";
  renderNav();
}

/* ---- 大图浏览（毛玻璃过渡） ---- */
let cur=0;
function openLb(i){
  closeDrawer();cur=i;
  lb.classList.remove("hidden");
  $("#lb-img").style.transform="scale(.94)";
  requestAnimationFrame(()=>{lb.classList.add("in");$("#lb-img").style.transform="scale(1)"});
  document.body.classList.add("locked");show();
}
function show(){
  const p=photos[cur];
  $("#lb-img").src=p.u;
  $("#lb-cnt").textContent=p.a+" · "+(cur+1)+" / "+photos.length;
  [(cur+1)%photos.length,(cur-1+photos.length)%photos.length].forEach(k=>{new Image().src=photos[k].u});
}
function closeLb(){
  lb.classList.remove("in");
  setTimeout(()=>{lb.classList.add("hidden");$("#lb-img").src=""},280);
  document.body.classList.remove("locked");
}
function step(d){cur=(cur+d+photos.length)%photos.length;show()}
$("#lb-close").addEventListener("click",closeLb);
$("#lb-prev").addEventListener("click",()=>step(-1));
$("#lb-next").addEventListener("click",()=>step(1));
lb.addEventListener("click",e=>{if(e.target.classList.contains("lb-stage"))closeLb()});
let tx=0,ty=0;
lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
lb.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);
  else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLb();
},{passive:true});
document.addEventListener("keydown",e=>{
  if(lb.classList.contains("hidden"))return;
  if(e.key==="Escape"){closeLb();closeDrawer()}
  else if(e.key==="ArrowLeft")step(-1);
  else if(e.key==="ArrowRight")step(1);
});

/* ---- 启动 ---- */
document.body.classList.add("locked");
if(passOk())unlock();
</script>
</body>
