<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17694a">
<title>球队相册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f3f6f4;color:#24312a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh}
button{font-family:inherit}
/* ---- 访问密码门 ---- */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#1a7a4a,#0d4d34);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.gate-card{background:#fff;border-radius:18px;padding:34px 26px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.gate-ico{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:#e8f4ee;display:flex;align-items:center;justify-content:center}
.gate-card h1{font-size:20px;color:#17694a;margin-bottom:4px}
.gate-card p{font-size:13px;color:#8a968f;margin-bottom:20px}
#pwd{width:100%;height:46px;border:1.5px solid #d5ded9;border-radius:12px;padding:0 14px;font-size:16px;outline:none;text-align:center;letter-spacing:2px}
#pwd:focus{border-color:#1a7a4a}
#btn-enter{width:100%;height:46px;border:none;border-radius:12px;background:#1a7a4a;color:#fff;font-size:16px;margin-top:14px;cursor:pointer}
#btn-enter:active{background:#0f5c37}
#gate-err{font-size:12px;color:#d0452f;margin-top:12px;min-height:16px}
/* ---- 相册主体 ---- */
#app{max-width:640px;margin:0 auto;padding-bottom:40px}
header{background:linear-gradient(160deg,#1a7a4a,#0d4d34);padding:26px 18px 20px;color:#fff}
header h1{font-size:22px;font-weight:700}
header .sub{font-size:13px;opacity:.85;margin-top:4px}
header .note{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 10px;margin-top:12px}
.album-card{background:#fff;border-radius:14px;margin:14px 12px 0;overflow:hidden;box-shadow:0 2px 10px rgba(20,60,40,.05)}
.album-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.album-head .bar{width:4px;height:16px;border-radius:2px;background:#1a7a4a;flex:none}
.album-head .name{font-size:15px;font-weight:600}
.album-head .cnt{font-size:12px;color:#8a968f;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px 8px 10px}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:8px;background:#eef2ef;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
/* ---- 状态提示 ---- */
.state{padding:56px 20px;text-align:center;color:#8a968f;font-size:14px}
.state .ico{width:52px;height:52px;margin:0 auto 12px;color:#b9c6bf;display:block}
#btn-retry{margin-top:14px;height:38px;padding:0 22px;border:1.5px solid #1a7a4a;color:#1a7a4a;background:#fff;border-radius:20px;font-size:14px;cursor:pointer}
footer{text-align:center;font-size:11px;color:#a7b2ac;padding:26px 20px 0}
/* ---- 大图浏览 ---- */
#lb{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
.lb-cnt{font-size:13px;color:rgba(255,255,255,.75)}
#lb-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#lb-img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lb-prev{left:10px}
#lb-next{right:10px}
.lb-hint{text-align:center;color:rgba(255,255,255,.45);font-size:11px;padding:10px 0 calc(env(safe-area-inset-bottom) + 12px)}
.hidden{display:none!important}
.locked{overflow:hidden}
.spinner{width:34px;height:34px;margin:0 auto 12px;border:3px solid #dfe7e2;border-top-color:#1a7a4a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<!-- 访问密码门 -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-ico">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a7a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>球队相册</h1>
    <p>仅限球队家庭访问，请输入访问密码</p>
    <input id="pwd" type="password" placeholder="访问密码" autocomplete="off">
    <button id="btn-enter">进入相册</button>
    <div id="gate-err"></div>
  </div>
</div>

<!-- 相册主体 -->
<div id="app" class="hidden">
  <header>
    <h1>球队相册</h1>
    <div class="sub">记录孩子们的绿茵时光</div>
    <div class="note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      仅限球队家庭访问
    </div>
  </header>
  <div id="albums"></div>
  <footer>照片由教练统一整理上传 · 请勿将链接与密码外传</footer>
</div>

<!-- 大图浏览 -->
<div id="lb" class="hidden">
  <div class="lb-top">
    <div class="lb-cnt" id="lb-cnt"></div>
    <button id="lb-close" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="lb-stage">
    <img id="lb-img" alt="">
    <button id="lb-prev" class="lb-nav" aria-label="上一张">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="lb-next" class="lb-nav" aria-label="下一张">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="lb-hint">左右滑动切换 · 长按照片可保存</div>
</div>

<script>
"use strict";
/* ================= 配置 ================= */
const OWNER="seoj07617-stack", REPO="team-album";
const SITE="https://seoj07617-stack.github.io/team-album/";
const PASS_SHA256="072e379e98c0dc84cab004cf96aca539b05fe25f0398d0447de937772fc791ab"; // 访问密码的SHA-256，改密码请替换此值
const PASS_DAYS=30;
const IMG_RE=/\.(jpe?g|png|gif|webp|bmp)$/i;
/* ======================================== */

const $=s=>document.querySelector(s);
const gate=$("#gate"), app=$("#app"), albumsBox=$("#albums"), lb=$("#lb");
let photos=[];

/* ---- 访问密码 ---- */
async function sha256hex(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function passOk(){
  try{const o=JSON.parse(localStorage.getItem("album_pass_v1"));return o&&Date.now()-o.t<PASS_DAYS*864e5}
  catch(e){return false}
}
async function enter(){
  const v=$("#pwd").value.trim();
  if(!v){$("#gate-err").textContent="请输入密码";return}
  $("#btn-enter").textContent="验证中…";
  const ok=await sha256hex(v)===PASS_SHA256;
  $("#btn-enter").textContent="进入相册";
  if(ok){localStorage.setItem("album_pass_v1",JSON.stringify({t:Date.now()}));unlock()}
  else{$("#gate-err").textContent="密码不正确，请重试";$("#pwd").value=""}
}
function unlock(){
  gate.classList.add("hidden");document.body.classList.remove("locked");
  app.classList.remove("hidden");load();
}
$("#btn-enter").addEventListener("click",enter);
$("#pwd").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});

/* ---- 相册加载 ---- */
async function load(){
  albumsBox.innerHTML='<div class="state"><div class="spinner"></div>正在加载相册…</div>';
  try{
    const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/uploads",{headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)throw new Error(r.status);
    const dirs=(await r.json()).filter(d=>d.type==="dir");
    const albums=[];
    for(const d of dirs){
      const rr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/uploads/"+encodeURIComponent(d.name),{headers:{Accept:"application/vnd.github+json"}});
      if(!rr.ok)continue;
      const fs=(await rr.json()).filter(f=>f.type==="file"&&IMG_RE.test(f.name));
      if(fs.length)albums.push({name:d.name,files:fs});
    }
    render(albums);
  }catch(e){
    albumsBox.innerHTML='<div class="state">'
      +'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg>'
      +'相册加载失败，请检查网络后重试<button id="btn-retry">重新加载</button></div>';
    $("#btn-retry").addEventListener("click",load);
  }
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(albums){
  photos=[];
  if(!albums.length){
    albumsBox.innerHTML='<div class="state">'
      +'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>'
      +'照片整理中，敬请期待</div>';
    return;
  }
  let html="";
  for(const a of albums){
    html+='<section class="album-card"><div class="album-head"><span class="bar"></span><span class="name">'+esc(a.name)+'</span><span class="cnt">'+a.files.length+' 张</span></div><div class="grid">';
    for(const f of a.files){
      const url=SITE+"uploads/"+encodeURIComponent(a.name)+"/"+encodeURIComponent(f.name);
      const idx=photos.push({a:a.name,u:url})-1;
      html+='<div class="ph" data-i="'+idx+'"><img loading="lazy" src="'+url+'" alt=""></div>';
    }
    html+="</div></section>";
  }
  albumsBox.innerHTML=html;
  albumsBox.querySelectorAll(".ph").forEach(el=>el.addEventListener("click",()=>openLb(+el.dataset.i)));
}

/* ---- 大图浏览 ---- */
let cur=0;
function openLb(i){cur=i;lb.classList.remove("hidden");document.body.classList.add("locked");show()}
function show(){
  const p=photos[cur];
  $("#lb-img").src=p.u;
  $("#lb-cnt").textContent=p.a+" · "+(cur+1)+" / "+photos.length;
  [(cur+1)%photos.length,(cur-1+photos.length)%photos.length].forEach(k=>{new Image().src=photos[k].u});
}
function closeLb(){lb.classList.add("hidden");document.body.classList.remove("locked");$("#lb-img").src=""}
function step(d){cur=(cur+d+photos.length)%photos.length;show()}
$("#lb-close").addEventListener("click",closeLb);
$("#lb-prev").addEventListener("click",()=>step(-1));
$("#lb-next").addEventListener("click",()=>step(1));
lb.addEventListener("click",e=>{if(e.target.classList.contains("lb-stage"))closeLb()});
let tx=0,ty=0;
lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
lb.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);
  else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLb();
},{passive:true});
document.addEventListener("keydown",e=>{
  if(lb.classList.contains("hidden"))return;
  if(e.key==="Escape")closeLb();
  else if(e.key==="ArrowLeft")step(-1);
  else if(e.key==="ArrowRight")step(1);
});

/* ---- 启动 ---- */
document.body.classList.add("locked");
if(passOk())unlock();
</script>
</body>
</html>
