<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>球队相册</title>
<link rel="icon" href="assets/logo-crest.png">
<link rel="apple-touch-icon" href="assets/logo-crest.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="球队相册">

<style>
:root{
  --bg:#ffffff;--bg2:#f5f5f7;--line:#e8e8ed;
  --ink:#1d1d1f;--sub:#86868b;--faint:#aeaeb2;
  --tile:#f5f5f7;--tile-ink:#c7c7cc;
  --red:#ff3b30;--blue:#0a84ff;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#000000;--bg2:#1c1c1e;--line:#2c2c2e;--ink:#f5f5f7;--sub:#98989d;--faint:#636366;--tile:#1c1c1e;--tile-ink:#48484a}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
img{display:block}
.hidden{display:none!important}
.locked{overflow:hidden}

/* ============ 密码门 ============ */
#gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:320px;text-align:center}
.gate-card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.gate-crest{width:60px;height:60px;margin:0 auto 20px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.gate-card h1{font-size:21px;font-weight:700;letter-spacing:-.02em}
.gate-card .sub{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
.pwd-wrap{position:relative;margin-top:26px}
#pwd{width:100%;height:48px;border:none;border-radius:12px;padding:0 46px 0 14px;font-size:16px;outline:none;text-align:center;letter-spacing:1px;background:var(--bg2);color:var(--ink);transition:box-shadow .2s}
#pwd::placeholder{color:var(--faint);letter-spacing:0}
#pwd:focus{box-shadow:0 0 0 3px rgba(10,132,255,.28)}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
#eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#btn-enter{width:100%;height:48px;border-radius:12px;margin-top:12px;font-size:15px;font-weight:600;background:var(--ink);color:var(--bg);transition:opacity .2s}
#btn-enter:active{opacity:.7}
#gate-err{font-size:12px;color:var(--red);margin-top:14px;min-height:16px}
.gate-tip{margin-top:22px;font-size:11px;color:var(--faint);line-height:1.7}

/* ============ 顶栏 ============ */
#top{position:sticky;top:0;z-index:40;background:transparent;transition:background .25s,border-color .25s;border-bottom:1px solid transparent}
#top.scrolled{background:var(--bg);border-bottom-color:var(--line)}
@supports(backdrop-filter:blur(14px)){
  #top.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
}
.top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px}
#btn-back{display:none;align-items:center;gap:3px;font-size:15px;color:var(--blue);flex:none}
#btn-back.show{display:flex}
#btn-back svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#top .crest{width:26px;height:26px;flex:none;border-radius:7px}
#top .t{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .chip{margin-left:auto;flex:none;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}

/* ============ 主体 ============ */
#app{max-width:860px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom))}
@media(min-width:640px){#app{padding-left:28px;padding-right:28px}}

/* 编辑风格页头 */
#hero{padding:30px 0 4px}
#hero .crest{width:44px;height:44px;border-radius:11px;margin-bottom:16px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
#hero h2{font-size:31px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
#hero .s{font-size:14px;color:var(--sub);margin-top:7px;letter-spacing:-.01em}
#hero .stats{display:flex;gap:32px;margin-top:24px}
.hstat .v{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hstat .k{font-size:12px;color:var(--sub);margin-top:2px}

/* 相册分区 */
.sec-head{display:flex;align-items:baseline;margin:30px 0 14px}
.sec-head .t{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.sec-head .n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
#albums{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 16px}
@media(min-width:640px){#albums{grid-template-columns:repeat(3,1fr);gap:24px 20px}}
@media(min-width:900px){#albums{grid-template-columns:repeat(4,1fr)}}
.alb{text-align:left;animation:rise .45s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.alb:active .tile{transform:scale(.97)}
.tile{position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:var(--tile);transition:transform .2s}
.tile img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.tile img.cover.ok{opacity:1}
.tile .tico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tile-ink)}
.tile .tico svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.alb .name{font-size:14px;font-weight:600;margin-top:9px;letter-spacing:-.01em}
.alb .ct{font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}

/* 相册详情页 */
#view-album .alb-head{padding:26px 0 18px}
#view-album .alb-head .nm{font-size:27px;font-weight:700;letter-spacing:-.025em}
#view-album .alb-head .ct{font-size:13px;color:var(--sub);margin-top:5px;font-variant-numeric:tabular-nums}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media(min-width:640px){#grid{grid-template-columns:repeat(4,1fr);gap:5px}}
@media(min-width:900px){#grid{grid-template-columns:repeat(5,1fr);gap:6px}}
.ph{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:var(--tile);animation:rise .4s cubic-bezier(.16,1,.3,1) both}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph img.ok{opacity:1}
.ph:active img.ok{transform:scale(.96)}
.empty-album{padding:72px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.9}
.empty-album svg{width:36px;height:36px;color:var(--tile-ink);margin:0 auto 12px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* 骨架屏 */
.skel{display:contents}
.sk{aspect-ratio:1/1;border-radius:15px;background:var(--tile);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* 加载失败 */
.fail{background:var(--bg2);border-radius:15px;padding:52px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
#btn-retry{margin-top:18px;height:40px;padding:0 26px;color:var(--blue);font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:20px;background:var(--bg)}

footer{text-align:center;font-size:11px;color:var(--faint);padding:34px 12px 0;line-height:1.9}

/* ============ 大图查看器 ============ */
#lb{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;opacity:0;transition:opacity .25s}
#lb.in{opacity:1}
.lb-top{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;color:#fff}
#lb-cnt{font-size:14px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums;margin-right:auto;font-weight:500}
#lb-dl{height:34px;padding:0 15px;border-radius:17px;font-size:13.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:6px;text-decoration:none;transition:background .2s}
#lb-dl:active{background:rgba(255,255,255,.3)}
#lb-dl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lb-close{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s}
#lb-close:active{background:rgba(255,255,255,.3)}
#lb-close svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;min-height:0}
#lb-img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#lb-prev{left:10px}
#lb-next{right:10px}
.lb-bot{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;color:rgba(255,255,255,.35);font-size:11px}
#lb-album{display:inline-block;color:rgba(255,255,255,.8);font-size:12.5px;font-weight:600;margin-bottom:6px}
</style>
</head>
<body>
<noscript><div style="padding:40px;text-align:center;font-size:14px;color:#888">本相册需要启用 JavaScript 才能浏览</div></noscript>

<script>
"use strict";
/* ================= 配置 ================= */
const OWNER="seoj07617-stack", REPO="team-album";
const SITE="https://seoj07617-stack.github.io/team-album/";
const PASS_SHA256="072e379e98c0dc84cab004cf96aca539b05fe25f0398d0447de937772fc791ab"; // 访问密码的SHA-256，改密码请替换此值
const PASS_DAYS=30;
const IMG_RE=/\.(jpe?g|png|gif|webp|bmp)$/i;
const ORDER=["集体照","训练照","比赛照","个人照"];
const TICON={
  "集体照":'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3.5"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M15.5 3.6a3.5 3.5 0 0 1 0 6.8"/></svg>',
  "训练照":'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></svg>',
  "比赛照":'<svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 3h12v6a6 6 0 0 1-12 0V3z"/><path d="M6 5H3v2a4 4 0 0 0 3 3.87"/><path d="M18 5h3v2a4 4 0 0 1-3 3.87"/></svg>',
  "个人照":'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="3.5"/></svg>',
  "_default":'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>'
};
/* ======================================== */

const $=s=>document.querySelector(s);
let ALBUMS=[],CUR=null,PHOTOS=[],lbIdx=0,loaded=false;

/* ---- 工具 ---- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ticon(n){return TICON[n]||TICON._default}
function purl(a,f){return SITE+"uploads/"+encodeURIComponent(a)+"/"+encodeURIComponent(f)}

/* ---- 访问密码 ---- */
async function sha256hex(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function passOk(){
  try{const o=JSON.parse(localStorage.getItem("album_pass_v1"));return o&&Date.now()-o.t<PASS_DAYS*864e5}catch(e){return false}
}
async function enter(){
  const v=$("#pwd").value.trim();
  if(!v){gateErr("请输入密码");return}
  $("#btn-enter").textContent="验证中…";
  let ok=false;
  try{ok=(await sha256hex(v))===PASS_SHA256}catch(e){gateErr("浏览器安全环境异常，请用 https 访问");$("#btn-enter").textContent="进入相册";return}
  $("#btn-enter").textContent="进入相册";
  if(ok){localStorage.setItem("album_pass_v1",JSON.stringify({t:Date.now()}));unlock()}
  else{gateErr("密码不正确，请重试");$("#pwd").value="";const c=$("#gate-card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}
}
function gateErr(m){$("#gate-err").textContent=m}
function unlock(){
  $("#gate").classList.add("hidden");document.body.classList.remove("locked");
  $("#app").classList.remove("hidden");
  load().then(()=>route());
}
$("#btn-enter").addEventListener("click",enter);
$("#pwd").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
$("#eye").addEventListener("click",()=>{
  const p=$("#pwd"),show=p.type==="password";
  p.type=show?"text":"password";p.focus();
});

/* ---- 相册数据：GitHub API → 本地缓存 → manifest 兜底 ---- */
function getJSON(url,timeout){
  return new Promise((res,rej)=>{
    const c=("AbortController"in window)?new AbortController():null;
    const t=setTimeout(()=>{if(c)c.abort();rej(new Error("timeout"))},timeout||8000);
    fetch(url,{headers:{Accept:"application/vnd.github+json"},signal:c?c.signal:undefined})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
      .then(j=>{clearTimeout(t);res(j)})
      .catch(e=>{clearTimeout(t);rej(e)});
  });
}
async function fromTrees(){
  const j=await getJSON("https://api.github.com/repos/"+OWNER+"/"+REPO+"/git/trees/main?recursive=1");
  const map={};
  for(const e of (j.tree||[])){
    if(e.type!=="blob")continue;
    const p=e.path||"";
    if(p.indexOf("uploads/")!==0||!IMG_RE.test(p))continue;
    const rest=p.slice(8),si=rest.indexOf("/");
    if(si<0||rest.indexOf("/",si+1)>=0)continue; /* 只认 uploads/相册/照片 一层结构 */
    (map[rest.slice(0,si)]=map[rest.slice(0,si)]||[]).push(rest.slice(si+1));
  }
  return Object.keys(map).map(n=>({name:n,files:map[n]}));
}
function saveCache(albums){
  try{localStorage.setItem("album_cache_v1",JSON.stringify({t:Date.now(),albums:albums.map(a=>({name:a.name,files:a.files}))}))}catch(e){}
}
function fromCache(){
  try{
    const c=JSON.parse(localStorage.getItem("album_cache_v1")||"null");
    if(!c||!Array.isArray(c.albums))return null;
    return c.albums.map(a=>({name:a.name,files:(a.files||[]).filter(n=>IMG_RE.test(n))}));
  }catch(e){return null}
}
async function fromManifest(){
  const m=await getJSON(SITE+"manifest.json?t="+Date.now());
  return (m.albums||[]).map(a=>({name:a.name,files:(a.files||[]).filter(n=>IMG_RE.test(n))}));
}
async function load(){
  let albums=null;
  try{albums=await fromTrees();if(albums!==null)saveCache(albums)}catch(e){}
  if(albums===null)albums=fromCache();
  if(albums===null){try{albums=await fromManifest()}catch(e){}}
  if(albums===null){
    const d=document.createElement("div");d.className="fail";
    d.innerHTML='相册加载失败，请检查网络后重试<br><button id="btn-retry">重新加载</button>';
    $("#albums").innerHTML="";$("#albums").appendChild(d);
    d.querySelector("#btn-retry").addEventListener("click",()=>{location.reload()});
    return;
  }
  ALBUMS=albums;loaded=true;
  renderHome();
}

/* ---- 主页 ---- */
function albumNames(){
  const set=new Set(ORDER);
  ALBUMS.forEach(a=>set.add(a.name));
  return Array.from(set);
}
function renderHome(){
  const counts={};ALBUMS.forEach(a=>counts[a.name]=a.files.length);
  const names=albumNames();
  const total=ALBUMS.reduce((s,a)=>s+a.files.length,0);
  $("#stat-albums").textContent=names.length;
  $("#stat-photos").textContent=total;
  $("#top-title").textContent="球队相册";
  $("#top-chip").textContent="";$("#top-chip").style.display="none";
  $("#sec-n").textContent="共 "+names.filter(n=>counts[n]>0).length+" 个已有照片";
  let html="";
  names.forEach((n,i)=>{
    const c=counts[n]||0;
    let tile;
    if(c>0){
      const cover=purl(n,ALBUMS.find(a=>a.name===n).files[0]);
      tile='<div class="tile"><img class="cover" loading="lazy" src="'+cover+'" alt="" onload="this.classList.add(\'ok\')"></div>';
    }else{
      tile='<div class="tile"><span class="tico">'+ticon(n)+'</span></div>';
    }
    html+='<button class="alb" data-n="'+esc(n)+'" style="animation-delay:'+(i*50)+'ms">'+tile
      +'<div class="name">'+esc(n)+'</div><div class="ct">'+(c>0?(c+" 张照片"):"待上传")+'</div></button>';
  });
  $("#albums").innerHTML=html;
  $("#albums").querySelectorAll(".alb").forEach(el=>el.addEventListener("click",()=>openAlbum(el.dataset.n)));
}

/* ---- 相册详情 ---- */
function openAlbum(name){
  if(CUR===name&&!$("#view-album").classList.contains("hidden"))return; /* 已在该相册，避免路由回环重复渲染 */
  CUR=name;
  const a=ALBUMS.find(x=>x.name===name)||{name:name,files:[]};
  PHOTOS=a.files.map(f=>({a:name,u:purl(name,f),f:f}));
  $("#top-title").textContent=name;
  $("#top-chip").textContent=a.files.length+" 张";
  $("#top-chip").style.display="";
  $("#btn-back").classList.add("show");
  $("#al-name").textContent=name;
  $("#al-ct").textContent=a.files.length?("共 "+a.files.length+" 张照片"):"";
  let html="";
  PHOTOS.forEach((p,i)=>{
    html+='<button class="ph" data-i="'+i+'" style="animation-delay:'+Math.min(i*30,400)+'ms">'
      +'<img loading="lazy" src="'+p.u+'" alt="" onload="this.classList.add(\'ok\')"></button>';
  });
  $("#grid").innerHTML=html;
  $("#al-empty").classList.toggle("hidden",PHOTOS.length>0);
  $("#grid").querySelectorAll(".ph").forEach(el=>el.addEventListener("click",()=>openLb(+el.dataset.i)));
  $("#view-home").classList.add("hidden");
  $("#view-album").classList.remove("hidden");
  if(location.hash!=="#a="+encodeURIComponent(name))location.hash="a="+encodeURIComponent(name);
  window.scrollTo({top:0,behavior:"auto"});
}
function goHome(){
  if(CUR===null&&!$("#view-home").classList.contains("hidden")&&!location.hash)return;
  CUR=null;PHOTOS=[];
  $("#btn-back").classList.remove("show");
  if(loaded)renderHome();
  $("#view-album").classList.add("hidden");
  $("#view-home").classList.remove("hidden");
  if(location.hash)location.hash="";
  window.scrollTo({top:0,behavior:"auto"});
}
$("#btn-back").addEventListener("click",goHome);

/* ---- 路由（支持相册直达链接 #a=相册名） ---- */
function route(){
  if(!loaded)return;
  const m=/^#a=(.+)$/.exec(location.hash);
  if(m){
    const name=decodeURIComponent(m[1]);
    if(albumNames().indexOf(name)>=0)openAlbum(name);else goHome();
  }else{
    goHome();
  }
}
window.addEventListener("hashchange",route);

/* ---- 顶栏滚动状态 ---- */
const topEl=$("#top");
function onScroll(){topEl.classList.toggle("scrolled",window.scrollY>8)}
window.addEventListener("scroll",onScroll,{passive:true});
onScroll();

/* ---- 大图查看器 ---- */
function openLb(i){
  lbIdx=i;$("#lb").classList.remove("hidden");
  requestAnimationFrame(()=>$("#lb").classList.add("in"));
  document.body.classList.add("locked");show();
}
function show(){
  const p=PHOTOS[lbIdx];
  $("#lb-img").src=p.u;
  $("#lb-cnt").textContent=(lbIdx+1)+" / "+PHOTOS.length;
  $("#lb-album").textContent=p.a;
  const dl=$("#lb-dl");dl.href=p.u;dl.setAttribute("download",p.f);
  [(lbIdx+1)%PHOTOS.length,(lbIdx-1+PHOTOS.length)%PHOTOS.length].forEach(k=>{if(k!==lbIdx){const im=new Image();im.src=PHOTOS[k].u}});
}
function closeLb(){
  $("#lb").classList.remove("in");
  setTimeout(()=>{$("#lb").classList.add("hidden");$("#lb-img").src=""},240);
  document.body.classList.remove("locked");
}
function step(d){if(!PHOTOS.length)return;lbIdx=(lbIdx+d+PHOTOS.length)%PHOTOS.length;show()}
$("#lb-close").addEventListener("click",closeLb);
$("#lb-prev").addEventListener("click",()=>step(-1));
$("#lb-next").addEventListener("click",()=>step(1));
$("#lb-stage").addEventListener("click",e=>{if(e.target.id==="lb-stage")closeLb()});
let tx=0,ty=0;
$("#lb").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("#lb").addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);
  else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLb();
},{passive:true});
document.addEventListener("keydown",e=>{
  if(!$("#lb").classList.contains("hidden")){
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")step(-1);
    else if(e.key==="ArrowRight")step(1);
  }
});

/* ---- 启动 ---- */
document.body.classList.add("locked");
if(passOk())unlock();
</script>
</body>
