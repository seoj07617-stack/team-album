<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4338ca" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d16" media="(prefers-color-scheme: dark)">
<title>球队相册</title>
<link rel="icon" href="assets/logo-crest.png">
<link rel="apple-touch-icon" href="assets/logo-crest.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="球队相册">
<link rel="manifest" href="site.webmanifest">
<style>
:root{
  --bg:#f4f5fa;--card:#ffffff;--line:#eceef4;--glass:rgba(255,255,255,.82);
  --ink:#101322;--sub:#5b6472;--faint:#9aa3af;
  --brand:#4f46e5;--brand-deep:#4338ca;--glow:rgba(79,70,229,.09);
  --radius:16px;--radius-s:12px;
  --shadow:0 10px 30px rgba(23,26,63,.08);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0b0d16;--card:#151929;--line:#242a41;--glass:rgba(11,13,22,.82);
    --ink:#f3f5fb;--sub:#9aa4b8;--faint:#6b7488;--glow:rgba(129,140,248,.12);
    --shadow:0 10px 30px rgba(0,0,0,.4)}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;color:inherit}
img{display:block}
.hidden{display:none!important}
.locked{overflow:hidden}
button{cursor:pointer}

/* ============ 密码门 ============ */
#gate{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:22px;
  background:radial-gradient(1100px 480px at 85% -10%,rgba(124,58,237,.5),transparent 60%),
             radial-gradient(900px 520px at -15% 110%,rgba(79,70,229,.5),transparent 55%),
             linear-gradient(160deg,#1b1440,#241b52 55%,#151230)}
.gate-card{width:100%;max-width:352px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:34px 26px 28px;text-align:center;box-shadow:0 24px 70px rgba(10,6,34,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
@media(prefers-color-scheme:dark){.gate-card{background:rgba(23,27,46,.92);border-color:rgba(255,255,255,.08)}}
.gate-card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.gate-crest{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#4338ca,#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(67,56,202,.45)}
.gate-crest img{width:44px;height:44px;filter:drop-shadow(0 2px 6px rgba(15,20,25,.4))}
.gate-card h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.gate-card .sub{font-size:13px;color:var(--sub);margin:5px 0 22px}
.pwd-wrap{position:relative}
#pwd{width:100%;height:48px;border:1.5px solid var(--line);border-radius:13px;padding:0 46px 0 16px;font-size:16px;outline:none;text-align:center;letter-spacing:2px;background:var(--bg);color:var(--ink);transition:border .2s,box-shadow .2s}
#pwd:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--glow);background:var(--card)}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
#eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#btn-enter{width:100%;height:48px;border:none;border-radius:13px;margin-top:14px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 8px 22px rgba(79,70,229,.35);transition:transform .15s,box-shadow .2s}
#btn-enter:active{transform:scale(.97);box-shadow:0 4px 12px rgba(79,70,229,.3)}
#gate-err{font-size:12px;color:#dc2626;margin-top:12px;min-height:16px}
.gate-tip{margin-top:16px;font-size:11px;color:var(--faint);line-height:1.7}

/* ============ 顶栏 ============ */
#top{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
#btn-back{width:36px;height:36px;border:none;border-radius:11px;background:var(--glow);color:var(--brand);display:none;align-items:center;justify-content:center;flex:none;transition:transform .15s}
#btn-back:active{transform:scale(.92)}
#btn-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#btn-back.show{display:flex}
#top .crest{width:32px;height:32px;flex:none;border-radius:9px;box-shadow:0 3px 8px rgba(23,26,63,.18)}
#top .t{font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .chip{margin-left:auto;flex:none;font-size:12px;font-weight:600;color:var(--brand);background:var(--glow);padding:7px 13px;border-radius:999px;font-variant-numeric:tabular-nums}

/* ============ 主体 ============ */
#app{max-width:920px;margin:0 auto;padding:14px 16px calc(44px + env(safe-area-inset-bottom))}
@media(min-width:640px){#app{padding-left:24px;padding-right:24px}}

/* 沉浸式头部 */
#hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 22px 22px;color:#fff;
  background:linear-gradient(135deg,#4338ca 0%,#6d28d9 60%,#7c3aed 100%);box-shadow:0 18px 44px rgba(67,56,202,.35)}
#hero::before,#hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
#hero::before{width:240px;height:240px;right:-70px;top:-110px;background:rgba(255,255,255,.14)}
#hero::after{width:170px;height:170px;left:-60px;bottom:-90px;background:rgba(255,255,255,.08)}
.hero-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero-row .crest{width:58px;height:58px;flex:none;border-radius:16px;background:rgba(255,255,255,.16);padding:6px;box-shadow:0 6px 18px rgba(15,10,50,.35)}
.hero-row h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.hero-row .s{font-size:12px;opacity:.85;margin-top:3px}
.hero-stats{display:flex;gap:10px;margin-top:20px;position:relative;z-index:1}
.hstat{flex:1;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hstat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.hstat .k{font-size:11px;opacity:.82;margin-top:2px}

/* 相册封面卡 */
.sec-title{display:flex;align-items:center;gap:8px;margin:22px 2px 12px;font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec-title .n{font-size:12px;color:var(--faint);font-weight:600}
#albums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){#albums{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){#albums{grid-template-columns:repeat(4,1fr)}}
.alb{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:1/1.06;border:none;padding:0;background:var(--card);box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.16,1,.3,1) both;transition:transform .18s}
.alb:active{transform:scale(.965)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.alb img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .4s}
.alb img.cover.ok{opacity:1}
.alb .mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,24,0) 42%,rgba(8,6,24,.72) 100%)}
.alb .badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;color:#fff;background:rgba(10,8,30,.45);border:1px solid rgba(255,255,255,.25);padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.alb .name{position:absolute;left:12px;right:12px;bottom:11px;text-align:left;color:#fff;font-size:14.5px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.alb .name small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:1px}
/* 空相册占位卡 */
.alb.empty{background:var(--card);border:1.5px dashed var(--line);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.alb.empty .chip{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.alb.empty .chip svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.alb.empty .nm{font-size:13.5px;font-weight:700}
.alb.empty .st{font-size:11px;color:var(--faint)}

/* 提示条 */
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;margin-top:14px;font-size:12px;color:var(--sub);line-height:1.7}
.tip svg{width:16px;height:16px;flex:none;margin-top:2px;fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 相册详情页 */
#view-album .alb-head{display:flex;align-items:center;gap:12px;margin:6px 2px 14px}
.alb-head .chip{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.alb-head .chip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.alb-head .nm{font-size:19px;font-weight:800;letter-spacing:-.02em}
.alb-head .ct{font-size:12px;color:var(--sub);margin-top:2px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
@media(min-width:640px){#grid{grid-template-columns:repeat(4,1fr);gap:7px}}
@media(min-width:900px){#grid{grid-template-columns:repeat(5,1fr);gap:8px}}
.ph{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:var(--line);border:none;padding:0;animation:rise .45s cubic-bezier(.16,1,.3,1) both}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .3s}
.ph img.ok{opacity:1}
.ph:active img.ok{transform:scale(.95)}
.empty-album{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);padding:52px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}

/* 骨架屏 */
.skel{display:contents}
.sk{aspect-ratio:1/1.06;border-radius:var(--radius);background:linear-gradient(100deg,var(--line) 40%,var(--card) 50%,var(--line) 60%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* 加载失败 */
.fail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--sub);font-size:14px}
.fail .ico{width:46px;height:46px;margin:0 auto 12px;color:var(--faint)}
#btn-retry{margin-top:16px;height:38px;padding:0 24px;border:none;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:999px;font-size:13px;font-weight:700}

footer{text-align:center;font-size:11px;color:var(--faint);padding:26px 20px 0;line-height:1.8}

/* ============ 大图查看器 ============ */
#lb{position:fixed;inset:0;z-index:60;background:rgba(8,8,14,.96);display:flex;flex-direction:column;opacity:0;transition:opacity .25s}
#lb.in{opacity:1}
.lb-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;color:#fff}
#lb-cnt{font-size:13px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-btn{width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s}
.lb-btn:active{background:rgba(255,255,255,.28)}
.lb-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
#lb-dl{width:auto;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;gap:6px;display:flex;align-items:center;text-decoration:none}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;min-height:0}
#lb-img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .25s}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#lb-prev{left:10px}
#lb-next{right:10px}
.lb-bot{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;color:rgba(255,255,255,.45);font-size:11px}
#lb-album{display:inline-block;color:rgba(255,255,255,.85);font-size:12.5px;font-weight:600;background:rgba(255,255,255,.1);padding:5px 13px;border-radius:999px;margin-bottom:6px}
</style>
</head>
<body>
<noscript><div style="padding:40px;text-align:center;font-size:14px;color:#666">本相册需要启用 JavaScript 才能浏览</div></noscript>

<!-- 密码门 -->
<div id="gate">
  <div class="gate-card" id="gate-card">
    <div class="gate-crest"><img src="assets/logo-crest.png" alt="队徽"></div>
    <h1>球队相册</h1>

<!-- 主体 -->
<div id="app" class="hidden">
  <div id="top">

      <img class="crest" src="assets/logo-crest.png" alt="">

  <!-- 主页视图 -->
  <div id="view-home">

        <img class="crest" src="assets/logo-crest.png" alt="队徽">
        <div>
          <h2>球队相册</h2>

<!-- 大图查看器 -->
<div id="lb" class="hidden">

    <img id="lb-img" alt="">

</div>

<script>
"use strict";
/* ================= 配置 ================= */
const OWNER="seoj07617-stack", REPO="team-album";
const SITE="https://seoj07617-stack.github.io/team-album/";
const PASS_SHA256="072e379e98c0dc84cab004cf96aca539b05fe25f0398d0447de937772fc791ab"; // 访问密码的SHA-256，改密码请替换此值
const PASS_DAYS=30;
const IMG_RE=/\.(jpe?g|png|gif|webp|bmp)$/i;
const ORDER=["集体照","训练照","比赛照","个人照"];
const THEME={
  "集体照":{c:"#4f46e5",bg:"rgba(79,70,229,0.1)",icon:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3.5"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M15.5 3.6a3.5 3.5 0 0 1 0 6.8"/></svg>'},
  "训练照":{c:"#059669",bg:"rgba(5,150,105,0.1)",icon:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></svg>'},
  "比赛照":{c:"#d97706",bg:"rgba(217,119,6,0.1)",icon:'<svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 3h12v6a6 6 0 0 1-12 0V3z"/><path d="M6 5H3v2a4 4 0 0 0 3 3.87"/><path d="M18 5h3v2a4 4 0 0 1-3 3.87"/></svg>'},
  "个人照":{c:"#2563eb",bg:"rgba(37,99,235,0.1)",icon:'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="3.5"/></svg>'},
  "_default":{c:"#4f46e5",bg:"rgba(79,70,229,0.1)",icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>'}
};
/* ======================================== */

const $=s=>document.querySelector(s);
let ALBUMS=[],CUR=null,PHOTOS=[],lbIdx=0,loaded=false;

/* ---- 工具 ---- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function theme(n){return THEME[n]||THEME._default}
function purl(a,f){return SITE+"uploads/"+encodeURIComponent(a)+"/"+encodeURIComponent(f)}

/* ---- 访问密码 ---- */
async function sha256hex(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function passOk(){
  try{const o=JSON.parse(localStorage.getItem("album_pass_v1"));return o&&Date.now()-o.t<PASS_DAYS*864e5}catch(e){return false}
}
async function enter(){
  const v=$("#pwd").value.trim();
  if(!v){gateErr("请输入密码");return}
  $("#btn-enter").textContent="验证中…";
  let ok=false;
  try{ok=(await sha256hex(v))===PASS_SHA256}catch(e){gateErr("浏览器安全环境异常，请用 https 访问");$("#btn-enter").textContent="进入相册";return}
  $("#btn-enter").textContent="进入相册";
  if(ok){localStorage.setItem("album_pass_v1",JSON.stringify({t:Date.now()}));unlock()}
  else{gateErr("密码不正确，请重试");$("#pwd").value="";const c=$("#gate-card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}
}
function gateErr(m){$("#gate-err").textContent=m}
function unlock(){
  $("#gate").classList.add("hidden");document.body.classList.remove("locked");
  $("#app").classList.remove("hidden");
  load().then(()=>route());
}
$("#btn-enter").addEventListener("click",enter);
$("#pwd").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
$("#eye").addEventListener("click",()=>{
  const p=$("#pwd"),show=p.type==="password";
  p.type=show?"text":"password";p.focus();
});

/* ---- 相册数据：GitHub API → 本地缓存 → manifest 兜底 ---- */
function getJSON(url,timeout){
  return new Promise((res,rej)=>{
    const c=("AbortController"in window)?new AbortController():null;
    const t=setTimeout(()=>{if(c)c.abort();rej(new Error("timeout"))},timeout||8000);
    fetch(url,{headers:{Accept:"application/vnd.github+json"},signal:c?c.signal:undefined})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
      .then(j=>{clearTimeout(t);res(j)})
      .catch(e=>{clearTimeout(t);rej(e)});
  });
}
async function fromTrees(){
  const j=await getJSON("https://api.github.com/repos/"+OWNER+"/"+REPO+"/git/trees/main?recursive=1");
  const map={};
  for(const e of (j.tree||[])){
    if(e.type!=="blob")continue;
    const p=e.path||"";
    if(p.indexOf("uploads/")!==0||!IMG_RE.test(p))continue;
    const rest=p.slice(8),si=rest.indexOf("/");
    if(si<0||rest.indexOf("/",si+1)>=0)continue; /* 只认 uploads/相册/照片 一层结构 */
    (map[rest.slice(0,si)]=map[rest.slice(0,si)]||[]).push(rest.slice(si+1));
  }
  return Object.keys(map).map(n=>({name:n,files:map[n]}));
}
function saveCache(albums){
  try{localStorage.setItem("album_cache_v1",JSON.stringify({t:Date.now(),albums:albums.map(a=>({name:a.name,files:a.files}))}))}catch(e){}
}
function fromCache(){
  try{
    const c=JSON.parse(localStorage.getItem("album_cache_v1")||"null");
    if(!c||!Array.isArray(c.albums))return null;
    return c.albums.map(a=>({name:a.name,files:(a.files||[]).filter(n=>IMG_RE.test(n))}));
  }catch(e){return null}
}
async function fromManifest(){
  const m=await getJSON(SITE+"manifest.json?t="+Date.now());
  return (m.albums||[]).map(a=>({name:a.name,files:(a.files||[]).filter(n=>IMG_RE.test(n))}));
}
async function load(){
  let albums=null;
  try{albums=await fromTrees();if(albums!==null)saveCache(albums)}catch(e){}
  if(albums===null)albums=fromCache();
  if(albums===null){try{albums=await fromManifest()}catch(e){}}
  if(albums===null){
    $("#albums").innerHTML="";
    $("#stat-albums").textContent="–";$("#stat-photos").textContent="–";
    const d=document.createElement("div");d.className="fail";
    d.innerHTML='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor" stroke="none"/></svg>相册加载失败，请检查网络后重试<br><button id="btn-retry">重新加载</button>';
    $("#albums").appendChild(d);
    d.querySelector("#btn-retry").addEventListener("click",()=>{location.reload()});
    return;
  }
  ALBUMS=albums;loaded=true;
  renderHome();
}

/* ---- 主页 ---- */
function albumNames(){
  const set=new Set(ORDER);
  ALBUMS.forEach(a=>set.add(a.name));
  return Array.from(set);
}
function renderHome(){
  const counts={};ALBUMS.forEach(a=>counts[a.name]=a.files.length);
  const names=albumNames();
  const total=ALBUMS.reduce((s,a)=>s+a.files.length,0);
  $("#stat-albums").textContent=names.length;
  $("#stat-photos").textContent=total;
  $("#top-title").textContent="球队相册";
  $("#top-chip").textContent=total?("共 "+total+" 张"):"";
  $("#top-chip").style.display=total?"":"none";
  $("#sec-n").textContent=names.filter(n=>counts[n]>0).length+" 个已有照片";
  let html="";
  names.forEach((n,i)=>{
    const th=theme(n),c=counts[n]||0;
    if(c>0){
      const cover=purl(n,ALBUMS.find(a=>a.name===n).files[0]);
      html+='<button class="alb" data-n="'+esc(n)+'" style="animation-delay:'+(i*55)+'ms">'
        +'<img class="cover" loading="lazy" src="'+cover+'" alt="" onload="this.classList.add(\'ok\')">'
        +'<span class="mask"></span><span class="badge">'+c+' 张</span>'
        +'<span class="name">'+esc(n)+'<small>点击查看</small></span></button>';
    }else{
      html+='<button class="alb empty" data-n="'+esc(n)+'" style="animation-delay:'+(i*55)+'ms">'
        +'<span class="chip" style="color:'+th.c+';background:'+th.bg+'">'+th.icon+'</span>'
        +'<span class="nm">'+esc(n)+'</span><span class="st">照片待上传</span></button>';
    }
  });
  $("#albums").innerHTML=html;
  $("#albums").querySelectorAll(".alb").forEach(el=>el.addEventListener("click",()=>openAlbum(el.dataset.n)));
}

/* ---- 相册详情 ---- */
function openAlbum(name){
  if(CUR===name&&!$("#view-album").classList.contains("hidden"))return; /* 已在该相册，避免路由回环重复渲染 */
  CUR=name;
  const a=ALBUMS.find(x=>x.name===name)||{name:name,files:[]};
  PHOTOS=a.files.map(f=>({a:name,u:purl(name,f),f:f}));
  const th=theme(name);
  $("#top-title").textContent=name;
  $("#top-chip").textContent=a.files.length+" 张";
  $("#top-chip").style.display="";
  $("#btn-back").classList.add("show");
  $("#al-chip").innerHTML=th.icon;
  $("#al-chip").style.color=th.c;$("#al-chip").style.background=th.bg;
  $("#al-name").textContent=name;
  $("#al-ct").textContent=a.files.length?("共 "+a.files.length+" 张照片"):"";
  let html="";
  PHOTOS.forEach((p,i)=>{
    html+='<button class="ph" data-i="'+i+'" style="animation-delay:'+Math.min(i*30,400)+'ms">'
      +'<img loading="lazy" src="'+p.u+'" alt="" onload="this.classList.add(\'ok\')"></button>';
  });
  $("#grid").innerHTML=html;
  $("#al-empty").classList.toggle("hidden",PHOTOS.length>0);
  $("#grid").querySelectorAll(".ph").forEach(el=>el.addEventListener("click",()=>openLb(+el.dataset.i)));
  $("#view-home").classList.add("hidden");
  $("#view-album").classList.remove("hidden");
  if(location.hash!=="#a="+encodeURIComponent(name))location.hash="a="+encodeURIComponent(name);
  window.scrollTo({top:0,behavior:"auto"});
}
function goHome(){
  if(CUR===null&&!$("#view-home").classList.contains("hidden")&&!location.hash)return;
  CUR=null;PHOTOS=[];
  $("#btn-back").classList.remove("show");
  if(loaded)renderHome();
  $("#view-album").classList.add("hidden");
  $("#view-home").classList.remove("hidden");
  if(location.hash)location.hash="";
  window.scrollTo({top:0,behavior:"auto"});
}
$("#btn-back").addEventListener("click",goHome);

/* ---- 路由（支持相册直达链接 #a=相册名） ---- */
function route(){
  if(!loaded)return;
  const m=/^#a=(.+)$/.exec(location.hash);
  if(m){
    const name=decodeURIComponent(m[1]);
    if(albumNames().indexOf(name)>=0)openAlbum(name);else goHome();
  }else{
    goHome();
  }
}
window.addEventListener("hashchange",route);

/* ---- 大图查看器 ---- */
function openLb(i){
  lbIdx=i;$("#lb").classList.remove("hidden");
  requestAnimationFrame(()=>$("#lb").classList.add("in"));
  document.body.classList.add("locked");show();
}
function show(){
  const p=PHOTOS[lbIdx];
  $("#lb-img").src=p.u;
  $("#lb-cnt").textContent=(lbIdx+1)+" / "+PHOTOS.length;
  $("#lb-album").textContent=p.a;
  const dl=$("#lb-dl");dl.href=p.u;dl.setAttribute("download",p.f);
  [(lbIdx+1)%PHOTOS.length,(lbIdx-1+PHOTOS.length)%PHOTOS.length].forEach(k=>{if(k!==lbIdx){const im=new Image();im.src=PHOTOS[k].u}});
}
function closeLb(){
  $("#lb").classList.remove("in");
  setTimeout(()=>{$("#lb").classList.add("hidden");$("#lb-img").src=""},240);
  document.body.classList.remove("locked");
}
function step(d){if(!PHOTOS.length)return;lbIdx=(lbIdx+d+PHOTOS.length)%PHOTOS.length;show()}
$("#lb-close").addEventListener("click",closeLb);
$("#lb-prev").addEventListener("click",()=>step(-1));
$("#lb-next").addEventListener("click",()=>step(1));
$("#lb-stage").addEventListener("click",e=>{if(e.target.id==="lb-stage")closeLb()});
let tx=0,ty=0;
$("#lb").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("#lb").addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);
  else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLb();
},{passive:true});
document.addEventListener("keydown",e=>{
  if(!$("#lb").classList.contains("hidden")){
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")step(-1);
    else if(e.key==="ArrowRight")step(1);
  }
});

/* ---- 启动 ---- */
document.body.classList.add("locked");
if(passOk())unlock();
</script>
