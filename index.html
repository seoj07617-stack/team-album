<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>球队相册</title>
<style>
:root{
  --bg:#f7f7f8; --card:#ffffff; --line:#eff3f4;
  --ink:#0f1419; --sub:#536471;
  --purple:#5b5bd6; --purple-glow:rgba(91,91,214,0.08);
  --emerald:#059669; --amber:#d97706; --blue:#2563eb;
  --radius:12px; --radius-xs:8px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit}
/* ---- 顶栏 ---- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(env(safe-area-inset-top,0px) + 52px);padding:env(safe-area-inset-top,0px) 14px 0;background:linear-gradient(135deg,#5353cf,#7677e8);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px;box-shadow:0 2px 12px rgba(83,83,207,.25)}
#btn-menu{width:34px;height:34px;border:none;background:transparent;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex:none;margin-left:-8px;transition:background .2s var(--ease)}
#btn-menu:active{background:rgba(255,255,255,.16)}
#btn-menu svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#topbar .logo-img{width:27px;height:27px;flex:none;display:block}
#topbar .t{font-size:16px;font-weight:700;letter-spacing:-0.02em;color:#fff}
#topbar .d{margin-left:auto;font-size:12px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
/* ---- 抽屉 ---- */
#drawer-mask{position:fixed;inset:0;background:rgba(15,20,25,.42);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
#drawer-mask.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:284px;max-width:82vw;background:var(--card);z-index:46;transform:translateX(-103%);transition:transform .28s var(--ease);display:flex;flex-direction:column;border-right:1px solid var(--line);visibility:hidden}
#drawer.open{transform:none;visibility:visible}
.dr-head{background:linear-gradient(135deg,#5353cf,#7677e8);padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 22px;color:#fff;position:relative;overflow:hidden;flex:none}
.dr-head:before{content:'';position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.13)}
.dr-head:after{content:'';position:absolute;right:26px;bottom:-46px;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.09)}
.dr-head img{width:56px;height:56px;display:block;margin-bottom:12px;position:relative;z-index:1;filter:drop-shadow(0 2px 6px rgba(15,20,25,.18))}
.dr-title{font-size:18px;font-weight:700;letter-spacing:-0.02em;position:relative;z-index:1}
.dr-sub{font-size:12px;opacity:.88;margin-top:3px;position:relative;z-index:1}
.dr-nav{flex:1;overflow-y:auto;padding:12px 10px}
.dr-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-xs);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);transition:all .18s var(--ease)}
.dr-item:active{background:var(--bg)}
.dr-item.on{background:var(--purple-glow);color:var(--purple)}
.dr-item .chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.dr-item .chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dr-item .n{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.dr-item.on .n{color:var(--purple)}
.dr-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;color:#9aa1a8;border-top:1px solid var(--line);line-height:1.6;flex:none}
/* ---- 密码门 ---- */
#gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:34px 26px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 30px rgba(15,20,25,.06)}
.gate-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--purple-glow);display:flex;align-items:center;justify-content:center;color:var(--purple)}
.gate-card h1{font-size:18px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
.gate-card p{font-size:13px;color:var(--sub);margin-bottom:20px}
#pwd{width:100%;height:46px;border:1px solid #e5e5e5;border-radius:var(--radius-xs);padding:0 14px;font-size:16px;outline:none;text-align:center;letter-spacing:2px;background:#fafafa;transition:border .2s var(--ease)}
#pwd:focus{border-color:var(--purple);background:#fff}
#btn-enter{width:100%;height:46px;border:none;border-radius:var(--radius-xs);background:var(--purple);color:#fff;font-size:15px;font-weight:600;margin-top:14px;cursor:pointer;transition:all .2s var(--ease)}
#btn-enter:active{transform:scale(0.97)}
#gate-err{font-size:12px;color:#dc2626;margin-top:12px;min-height:16px}
/* ---- 主体 ---- */
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 66px) 16px 48px}
@media(min-width:600px){#app{padding-left:32px;padding-right:32px}}
/* ---- 紫色标签页 ---- */
#tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:30;padding:10px 0 4px;margin-bottom:12px;background:linear-gradient(to bottom,var(--bg) 80%,rgba(247,247,248,0))}
.tabs-wrap{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 0 0 4px var(--purple-glow);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;height:34px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;padding:0 15px;transition:all .2s var(--ease);letter-spacing:-0.01em}
.tab.on{background:var(--purple);color:#fff;box-shadow:0 2px 10px rgba(91,91,214,.32)}
/* 概览卡 */
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ov-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px;text-align:left;cursor:pointer;transition:all .2s var(--ease);position:relative;overflow:hidden}
.ov-card:active{transform:scale(0.97)}
.ov-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.ov-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ov-label{font-size:11px;color:var(--sub);font-weight:500}
.ov-value{font-size:22px;font-weight:700;letter-spacing:-0.03em;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
/* 相册分区 */
.album-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.album-head{display:flex;align-items:center;gap:10px;padding:13px 14px 9px}
.album-head .chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.album-head .chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.album-head .name{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.album-head .cnt{font-size:12px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px 8px 10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:6px;background:#f1f2f4;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
/* ---- 状态 ---- */
.state{padding:56px 20px;text-align:center;color:var(--sub);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.state .ico{width:52px;height:52px;margin:0 auto 12px;color:#c3c9cf;display:block}
.state .es-s{font-size:12px;color:#9aa1a8;margin-top:4px}
#btn-retry{margin-top:14px;height:36px;padding:0 22px;border:none;color:#fff;background:var(--purple);border-radius:18px;font-size:13px;font-weight:600;cursor:pointer}
footer{text-align:center;font-size:11px;color:#9aa1a8;padding:22px 20px 0}
/* ---- 大图 ---- */
#lb{position:fixed;inset:0;background:#0a0a0c;z-index:60;display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
.lb-cnt{font-size:13px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
#lb-close{background:rgba(255,255,255,.14);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#lb-img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lb-prev{left:10px}
#lb-next{right:10px}
.lb-hint{text-align:center;color:rgba(255,255,255,.4);font-size:11px;padding:10px 0 calc(env(safe-area-inset-bottom) + 12px)}
.hidden{display:none!important}
.locked{overflow:hidden}
.spinner{width:32px;height:32px;margin:0 auto 12px;border:3px solid #e5e7ea;border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 顶栏：左上角抽屉入口 + 队徽 -->
<div id="topbar" class="hidden">
  <button id="btn-menu" aria-label="打开菜单">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <img class="logo-img" src="assets/logo-white.png?v=3" alt="队徽">
  <div class="t">球队相册</div>
  <div class="d" id="total-cnt"></div>
</div>

<!-- 抽屉 -->
<div id="drawer-mask"></div>
<aside id="drawer">
  <div class="dr-head">
    <img src="assets/logo-white.png?v=2" alt="">
    <div class="dr-title">球队相册</div>
    <div class="dr-sub">球队家庭的专属记忆空间</div>
  </div>
  <nav class="dr-nav" id="dr-nav"></nav>
  <div class="dr-foot">仅限球队家庭访问<br>请勿将链接与密码外传</div>
</aside>

<!-- 访问密码门 -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-ico">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>球队相册</h1>
    <p>仅限球队家庭访问，请输入访问密码</p>
    <input id="pwd" type="password" placeholder="访问密码" autocomplete="off">
    <button id="btn-enter">进入相册</button>
    <div id="gate-err"></div>
  </div>
</div>

<!-- 相册主体 -->
<div id="app" class="hidden">
  <div id="tabs"></div>
  <div class="ov-grid" id="ov"></div>
  <div id="albums"></div>
  <div id="empty-state" class="state hidden">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
    <div class="es-t"></div>
    <div class="es-s">照片上传后即可在这里查看</div>
  </div>
  <footer>照片由教练统一整理上传 · 请勿将链接与密码外传</footer>
</div>

<!-- 大图浏览 -->
<div id="lb" class="hidden">
  <div class="lb-top">
    <div class="lb-cnt" id="lb-cnt"></div>
    <button id="lb-close" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="lb-stage">
    <img id="lb-img" alt="">
    <button id="lb-prev" class="lb-nav" aria-label="上一张">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="lb-next" class="lb-nav" aria-label="下一张">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="lb-hint">左右滑动切换 · 下滑关闭 · 长按可保存照片</div>
</div>

<script>
"use strict";
/* ================= 配置 ================= */
const OWNER="seoj07617-stack", REPO="team-album";
const SITE="https://seoj07617-stack.github.io/team-album/";
const PASS_SHA256="072e379e98c0dc84cab004cf96aca539b05fe25f0398d0447de937772fc791ab"; // 访问密码的SHA-256，改密码请替换此值
const PASS_DAYS=30;
const IMG_RE=/\.(jpe?g|png|gif|webp|bmp)$/i;
/* 相册图标与配色（新增相册名不在表内时用默认样式） */
const THEME={
  "全部":{c:"#5b5bd6",bg:"rgba(91,91,214,0.08)",icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>'},
  "集体照":{c:"#5b5bd6",bg:"rgba(91,91,214,0.08)",icon:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3.5"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M15.5 3.6a3.5 3.5 0 0 1 0 6.8"/></svg>'},
  "训练照":{c:"#059669",bg:"rgba(5,150,105,0.08)",icon:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></svg>'},
  "比赛照":{c:"#d97706",bg:"rgba(217,119,6,0.08)",icon:'<svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 3h12v6a6 6 0 0 1-12 0V3z"/><path d="M6 5H3v2a4 4 0 0 0 3 3.87"/><path d="M18 5h3v2a4 4 0 0 1-3 3.87"/></svg>'},
  "个人照":{c:"#2563eb",bg:"rgba(37,99,235,0.08)",icon:'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="3.5"/></svg>'},
  "_default":{c:"#536471",bg:"rgba(83,100,113,0.08)",icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>'}
};
/* ======================================== */

const $=s=>document.querySelector(s);
const gate=$("#gate"), app=$("#app"), albumsBox=$("#albums"), lb=$("#lb"), drawer=$("#drawer"), mask=$("#drawer-mask");
let photos=[], counts={}, curTab="全部", albumsCache=[];

/* ---- 访问密码 ---- */
async function sha256hex(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function passOk(){
  try{const o=JSON.parse(localStorage.getItem("album_pass_v1"));return o&&Date.now()-o.t<PASS_DAYS*864e5}
  catch(e){return false}
}
async function enter(){
  const v=$("#pwd").value.trim();
  if(!v){$("#gate-err").textContent="请输入密码";return}
  $("#btn-enter").textContent="验证中…";
  const ok=await sha256hex(v)===PASS_SHA256;
  $("#btn-enter").textContent="进入相册";
  if(ok){localStorage.setItem("album_pass_v1",JSON.stringify({t:Date.now()}));unlock()}
  else{$("#gate-err").textContent="密码不正确，请重试";$("#pwd").value=""}
}
function unlock(){
  gate.classList.add("hidden");document.body.classList.remove("locked");
  app.classList.remove("hidden");$("#topbar").classList.remove("hidden");
  load();
}
$("#btn-enter").addEventListener("click",enter);
$("#pwd").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});

/* ---- 抽屉 ---- */
function openDrawer(){drawer.classList.add("open");mask.classList.add("open")}
function closeDrawer(){drawer.classList.remove("open");mask.classList.remove("open")}
$("#btn-menu").addEventListener("click",openDrawer);
mask.addEventListener("click",closeDrawer);
$("#curbar-back").addEventListener("click",()=>setTab("全部"));
function navNames(){return ["全部","集体照","训练照","比赛照","个人照"]}
function theme(name){return THEME[name]||THEME["_default"]}

function renderNav(){
  const total=photos.length;
  $("#dr-nav").innerHTML=navNames().map(n=>{
    const th=theme(n), cnt=n==="全部"?total:(counts[n]||0);
    return '<div class="dr-item'+(n===curTab?' on':'')+'" data-n="'+esc(n)+'"><div class="chip" style="color:'+th.c+';background:'+th.bg+'">'+th.icon+'</div><span>'+esc(n)+'</span><span class="n">'+cnt+'</span></div>';
  }).join("");
  $("#dr-nav").querySelectorAll(".dr-item").forEach(el=>el.addEventListener("click",()=>setTab(el.dataset.n)));
  $("#tabs").innerHTML='<div class="tabs-wrap">'+navNames().map(n=>'<button class="tab'+(n===curTab?' on':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</button>').join("")+'</div>';
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.n)));
}

function setTab(name){
  curTab=name;
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.n===name));
  $("#dr-nav").querySelectorAll(".dr-item").forEach(b=>b.classList.toggle("on",b.dataset.n===name));
  const ov=$("#ov");
  if(name==="全部"){
    ov.style.display="";
    albumsBox.querySelectorAll(".album-card").forEach(s=>s.style.display="");
  }else{
    ov.style.display="none";
    albumsBox.querySelectorAll(".album-card").forEach(s=>s.style.display=(s.dataset.a===name)?"":"none");
  }
  const visible=[...albumsBox.querySelectorAll(".album-card")].some(s=>s.style.display!=="none");
  const es=$("#empty-state");
  if(name!=="全部"&&!visible&&albumsCache.length>0){
    es.querySelector(".es-t").textContent="「"+name+"」还在整理中";
    es.classList.remove("hidden");
  }else es.classList.add("hidden");
  closeDrawer();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---- 相册加载：优先GitHub API自动发现，失败时回退manifest清单 ---- */
function getJSON(url,timeout){
  return new Promise((res,rej)=>{
    const c=("AbortController"in window)?new AbortController():null;
    const t=setTimeout(()=>{if(c)c.abort();rej(new Error("timeout"))},timeout||8000);
    fetch(url,{headers:{Accept:"application/vnd.github+json"},signal:c?c.signal:undefined})
      .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
      .then(j=>{clearTimeout(t);res(j)})
      .catch(e=>{clearTimeout(t);rej(e)});
  });
}
async function fromAPI(){
  const dirs=(await getJSON("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/uploads")).filter(d=>d.type==="dir");
  const albums=[];
  for(const d of dirs){
    try{
      const fs=(await getJSON("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/uploads/"+encodeURIComponent(d.name))).filter(f=>f.type==="file"&&IMG_RE.test(f.name));
      if(fs.length)albums.push({name:d.name,files:fs});
    }catch(e){}
  }
  return albums;
}
async function fromManifest(){
  const m=await getJSON(SITE+"manifest.json?t="+Date.now());
  return (m.albums||[]).map(a=>({name:a.name,files:(a.files||[]).filter(n=>IMG_RE.test(n)).map(n=>({name:n}))})).filter(a=>a.files.length);
}
async function load(){
  albumsBox.innerHTML='<div class="state"><div class="spinner"></div>正在加载相册…</div>';
  $("#ov").innerHTML="";$("#empty-state").classList.add("hidden");
  let albums=null;
  try{albums=await fromAPI()}catch(e){}
  if(albums===null){try{albums=await fromManifest()}catch(e){}}
  if(albums===null){
    albumsBox.innerHTML='<div class="state">'
      +'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg>'
      +'相册加载失败，请检查网络后重试<button id="btn-retry">重新加载</button></div>';
    $("#btn-retry").addEventListener("click",load);
    return;
  }
  render(albums);
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(albums){
  photos=[];counts={};albumsCache=albums;
  $("#ov").innerHTML="";$("#empty-state").classList.add("hidden");
  if(!albums.length){
    albumsBox.innerHTML='<div class="state">'
      +'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>'
      +'照片整理中，敬请期待</div>';
    $("#total-cnt").textContent="";
    renderNav();
    return;
  }
  /* 概览卡 */
  let ov="";
  for(const a of albums){
    const th=theme(a.name);
    counts[a.name]=a.files.length;
    ov+='<div class="ov-card" data-n="'+esc(a.name)+'"><div class="ov-icon" style="color:'+th.c+';background:'+th.bg+'">'+th.icon+'</div><div class="ov-label">'+esc(a.name)+'</div><div class="ov-value">'+a.files.length+'</div></div>';
  }
  $("#ov").innerHTML=ov;
  $("#ov").querySelectorAll(".ov-card").forEach(el=>el.addEventListener("click",()=>setTab(el.dataset.n)));
  /* 相册分区 */
  let html="";
  for(const a of albums){
    const th=theme(a.name);
    html+='<section class="album-card" data-a="'+esc(a.name)+'"><div class="album-head"><div class="chip" style="color:'+th.c+';background:'+th.bg+'">'+th.icon+'</div><span class="name">'+esc(a.name)+'</span><span class="cnt">'+a.files.length+' 张</span></div><div class="grid">';
    for(const f of a.files){
      const url=SITE+"uploads/"+encodeURIComponent(a.name)+"/"+encodeURIComponent(f.name);
      const idx=photos.push({a:a.name,u:url})-1;
      html+='<div class="ph" data-i="'+idx+'"><img loading="lazy" src="'+url+'" alt=""></div>';
    }
    html+="</div></section>";
  }
  albumsBox.innerHTML=html;
  albumsBox.querySelectorAll(".ph").forEach(el=>el.addEventListener("click",()=>openLb(+el.dataset.i)));
  $("#total-cnt").textContent="共 "+photos.length+" 张";
  renderNav();
}

/* ---- 大图浏览 ---- */
let cur=0;
function openLb(i){closeDrawer();cur=i;lb.classList.remove("hidden");document.body.classList.add("locked");show()}
function show(){
  const p=photos[cur];
  $("#lb-img").src=p.u;
  $("#lb-cnt").textContent=p.a+" · "+(cur+1)+" / "+photos.length;
  [(cur+1)%photos.length,(cur-1+photos.length)%photos.length].forEach(k=>{new Image().src=photos[k].u});
}
function closeLb(){lb.classList.add("hidden");document.body.classList.remove("locked");$("#lb-img").src=""}
function step(d){cur=(cur+d+photos.length)%photos.length;show()}
$("#lb-close").addEventListener("click",closeLb);
$("#lb-prev").addEventListener("click",()=>step(-1));
$("#lb-next").addEventListener("click",()=>step(1));
lb.addEventListener("click",e=>{if(e.target.classList.contains("lb-stage"))closeLb()});
let tx=0,ty=0;
lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
lb.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);
  else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLb();
},{passive:true});
document.addEventListener("keydown",e=>{
  if(lb.classList.contains("hidden"))return;
  if(e.key==="Escape"){closeLb();closeDrawer()}
  else if(e.key==="ArrowLeft")step(-1);
  else if(e.key==="ArrowRight")step(1);
});

/* ---- 启动 ---- */
document.body.classList.add("locked");
if(passOk())unlock();
</script>
</body>
</html>
